[workspace]
members = ["protocol", "server"]

[package]
name = "amity"
version = "0.1.0"
edition = "2024"

[features]
# Native dev only. Points the client at a server on localhost and skips TLS
# validation so it accepts that server's self-signed certificate, which turns
# the test loop from "build wasm, deploy, open browser" into one command.
# NEVER use this for actual native
# clients
# Also carries dev-only tooling: the egui world inspector and bevy's UI
# outline overlay. Neither is compiled into a shipped build.
dev-local = [
    "amity-protocol/dev-local",
    "lightyear/webtransport_dangerous_configuration",
    "bevy/bevy_ui_debug",
    "dep:bevy-inspector-egui",
    # links bevy as a shared library so our crate relinks without dragging all
    # of bevy through each time. native only - breaks wasm, never ship it.
    "bevy/dynamic_linking",
]

[dependencies]
# rendering/window is required here, the client is not headless
avian3d = "0.7.0"
# cut down on the size of bevy
# TODO: re-add necessary features, probably want audio..
bevy = { version = "0.19", default-features = false, features = [
    "3d",
    "ui_bevy_render",
    "bevy_text",
    "default_font"
]}
lightyear = { version = "0.28.0", default-features = false, features = [
    "std",
    "client",
    "netcode",
    "webtransport",
    "replication",
    "prediction",
    "interpolation",
    "input_native",
    "avian3d",
]}
amity-protocol = { path = "protocol"} # protocol shared with server (client is root)
# dev-local only: live inspector for tuning UI nodes and eyeballing replication.
bevy-inspector-egui = { version = "0.37", optional = true }
# Set max log levels. This helps avoid unwanted low-severity log spam, which can affect performance.
log = { version = "0.4", features = [
    "max_level_debug",
] }
tracing = { version = "0.1", features = [
    "max_level_debug",
] }
getrandom = "0.4.3"
# the Help screen: parses assets/help.md (just the parser, no HTML output)
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
# WebGPU instead of WebGL2 on the web: the sky's atmosphere and auto-exposure run
# compute shaders, which WebGL2 doesn't have. Browsers without WebGPU can't run it
bevy = { version = "0.19", default-features = false, features = ["webgpu"] }
# the pause menu's Leave: goes back to the site's front page
web-sys = { version = "0.3", features = ["Window", "Location"] }

[build-dependencies]
# build.rs packs assets/images/blocks/*.png into the block texture atlas
png = "0.18"

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
# Full debuginfo is a large share of both compile and link time. Line tables
# still give backtraces with file:line, which is what we actually read.
debug = "line-tables-only"

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Our own crates too: world generation, lake flooding, colliders and meshing
# are heavy enough that opt-level 1 made a dev server fall behind (and desync
# players) while generating. Costs somewhat slower incremental builds.
[profile.dev.package.amity]
opt-level = 3
[profile.dev.package.amity-protocol]
opt-level = 3
[profile.dev.package.amity-server]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

# Release is never in the iteration loop, so it can take as long as it likes.
# NOTE: only applies to builds from this repo (the server, native clients).
# The wasm client is built as a dependency of burvy-dev, whose own
# [profile.release] wins - tune size over there, not here.
[profile.release]
# Compile the entire crate as one unit. Slow, best codegen.
codegen-units = 1
# Whole-program optimization across every crate, including dependencies.
# "fat" over "thin": strictly more optimization for strictly more time.
lto = "fat"

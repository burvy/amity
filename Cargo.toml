[workspace]
members = ["protocol", "server"]

[package]
name = "shooter"
version = "0.1.0"
edition = "2024"

[features]
# Native dev only. Skips TLS validation so `cargo run` can connect to the live
# server without owning its certificate, which turns the test loop from
# "build wasm, deploy, open browser" into one command.
# NEVER use this for actual native
# clients
# Also carries dev-only tooling: the egui world inspector and bevy's UI
# outline overlay. Neither is compiled into a shipped build.
dev-local = [
    "shooter-protocol/dev-local",
    "lightyear/webtransport_dangerous_configuration",
    "bevy/bevy_ui_debug",
    "dep:bevy-inspector-egui",
]

[dependencies]
# rendering/window is required here, the client is not headless
avian3d = "0.7.0"
# cut down on the size of bevy
# TODO: re-add necessary features, probably want audio..
bevy = { version = "0.19", default-features = false, features = [
    "3d",
    "ui_bevy_render",
    "bevy_text",
    "default_font"
]}
lightyear = { version = "0.28.0", default-features = false, features = [
    "std",
    "client",
    "netcode",
    "webtransport",
    "replication",
    "prediction",
    "interpolation",
    "input_native",
    "avian3d",
]}
shooter-protocol = { path = "protocol"} # protocol shared with server (client is root)
# dev-local only: live inspector for tuning UI nodes and eyeballing replication.
bevy-inspector-egui = { version = "0.37", optional = true }
# Set max log levels. This helps avoid unwanted low-severity log spam, which can affect performance.
log = { version = "0.4", features = [
    "max_level_debug",
] }
tracing = { version = "0.1", features = [
    "max_level_debug",
] }
getrandom = "0.4.3"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
